<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="作品大图">
  <button class="lb-close" id="lbClose" aria-label="关闭"></button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="上一张">&#8249;</button>
  <button class="lb-nav lb-next" id="lbNext" aria-label="下一张">&#8250;</button>
  <img id="lbImg" src="" alt="">
  <div class="lb-cap" id="lbCap"></div>
</div>

<script>
(function(){
  var items = Array.prototype.slice.call(document.querySelectorAll('.grid a'));
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbCap = document.getElementById('lbCap');
  var idx = -1;
  function show(i){
    if(items.length === 0) return;
    idx = (i + items.length) % items.length;
    var im = items[idx].querySelector('img');
    lbImg.src = im.src;
    lbImg.alt = im.alt;
    lbCap.textContent = (idx + 1) + ' / ' + items.length + ' · ' + im.alt;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  items.forEach(function(a, i){
    a.addEventListener('click', function(){ show(i); });
  });
  function close(){
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }
  function next(){ if(idx >= 0) show(idx + 1); }
  function prev(){ if(idx >= 0) show(idx - 1); }
  document.getElementById('lbClose').addEventListener('click', close);
  document.getElementById('lbNext').addEventListener('click', next);
  document.getElementById('lbPrev').addEventListener('click', prev);
  lb.addEventListener('click', function(e){ if(e.target === lb) close(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') close();
    if(e.key === 'ArrowRight') next();
    if(e.key === 'ArrowLeft') prev();
  });
})();
</script>
